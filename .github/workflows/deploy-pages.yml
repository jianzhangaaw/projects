name: Deploy 作品集

# site/ 是作品集落地页，projects/07-guizhou-tourism-web 在构建时复制到 site/guizhou/
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'projects/07-guizhou-tourism-web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 站点根是 site/：index.html 是作品集首页，guizhou/ 是从 07 项目复制过来的旅游站。
      # 旅游站的图片只在 projects/07 里存一份，这里靠复制组装，避免仓库里存两份 4.8 MB 的照片。
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r projects/07-guizhou-tourism-web site/guizhou
          ls -1 site
          du -sh site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
