name: Deploy 作品集

# site/ 是作品集落地页，项目详情页在构建时由 tools/build_site_docs.py 从各项目 README 生成
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'projects/*/README.md'
      - 'projects/*/docs/**'
      - 'tools/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 项目详情页由 README 渲染而来（site/projects/*.html），配图从各项目目录复制到
      # site/assets/docs/。生成物不进仓库，改完 README 推上来就自动重生成。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install markdown
        run: pip install "markdown>=3.5,<4"

      - name: Build project detail pages
        run: python tools/build_site_docs.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
