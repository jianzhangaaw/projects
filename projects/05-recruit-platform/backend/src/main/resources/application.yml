server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: resume-platform-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认连 docker-compose 里的 mysql 服务（端口 3307 映射到容器的 3306）
    url: ${DB_URL:jdbc:mysql://localhost:3307/recruit_resume?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:recruit}
    password: ${DB_PASSWORD:recruit_pwd_2026}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 阿里云 OSS 是可选的：不配 endpoint 就不会创建 OSS 客户端，
# 上传接口自动退化为本地磁盘存储（见 OssStorageService.ossAvailable()）。
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    url-prefix: ${ALIYUN_OSS_URL_PREFIX:}
    directory: ${ALIYUN_OSS_DIRECTORY:resume-platform}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-please-change-in-production-32bytes}
  expire-seconds: ${JWT_EXPIRE_SECONDS:7200}

file:
  preview:
    libre-office-path: ${FILE_PREVIEW_LIBRE_OFFICE_PATH:C:/Program Files/LibreOffice/program/soffice.com}
    cache-dir: ${FILE_PREVIEW_CACHE_DIR:${java.io.tmpdir}/recruit-resume-preview}
    convert-timeout-seconds: ${FILE_PREVIEW_CONVERT_TIMEOUT_SECONDS:60}

resume:
  pdf:
    render-timeout-seconds: ${RESUME_PDF_RENDER_TIMEOUT_SECONDS:60}

logging:
  level:
    com.recruit_resume: DEBUG
    com.recruit_resume.mapper: DEBUG
