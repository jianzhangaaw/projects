# 本地开发专用 profile：打开业务 DEBUG 与 MyBatis SQL 日志。
#
# 启动方式（三选一）：
#   mvnw.cmd -s settings.xml spring-boot:run -Dspring-boot.run.profiles=dev
#   java -jar target/xxx.jar --spring.profiles.active=dev
#   set SPRING_PROFILES_ACTIVE=dev 之后再启动
#
# 生产/默认 profile 不会打这些日志（见 application.yml 与 logback-spring.xml）。
logging:
  level:
    com.recruit_resume: DEBUG
    com.recruit_resume.mapper: DEBUG
